<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc"><title id="title">Featured project: MNG Construction</title><desc id="desc">A Calgary construction website with a project gallery, estimate requests, moderated reviews and a mobile admin dashboard.</desc><rect x="1" y="1" width="1278" height="278" rx="20" fill="#f5f2e9" stroke="#ded9c8"/><path d="M30 30V250" stroke="#c6a158" stroke-width="4" stroke-linecap="round"/><text x="62" y="49" font-family="monospace" font-size="11" letter-spacing="2" fill="#8e7846">PROJECT SPOTLIGHT / CALGARY</text><text x="60" y="105" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" letter-spacing="-1.3" fill="#25291f">MNG Construction</text><text x="62" y="145" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6c7062">A clear home for real work — from project photos to customer feedback.</text><g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5e6352"><text x="62" y="191">Project galleries</text><text x="254" y="191">Estimate requests</text><text x="464" y="191">Moderated reviews</text><text x="62" y="218">Mobile admin dashboard</text><text x="254" y="218">Before &amp; after photos</text><text x="464" y="218">Supabase content</text></g><rect x="966" y="36" width="278" height="208" rx="12" fill="#22271f"/><text x="991" y="70" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#d9bf7d">THE BUILD</text><path d="M991 87H1219" stroke="#535644"/><g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ecebdd"><text x="991" y="116">HTML · CSS · JavaScript</text><text x="991" y="149">Supabase · EmailJS</text><text x="991" y="182">Vercel · GitHub</text></g><text x="991" y="220" font-family="monospace" font-size="10" fill="#9ea38f">VIEW THE LIVE PROJECT ↗</text></svg>